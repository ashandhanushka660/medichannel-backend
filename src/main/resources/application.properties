# ==========================================
# MEDICHANNEL - MAIN APPLICATION CONFIG
# ==========================================

spring.application.name=medichannel

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool - conservative defaults for small Render instances
# Can be overridden with DB_POOL_SIZE and DB_MIN_IDLE environment variables.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Error Handling
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Server port (Render injects PORT; 8080 is used locally)
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Registration: accounts are auto-activated until an email
# verification provider is integrated.
app.registration.auto-activate=${APP_REGISTRATION_AUTO_ACTIVATE:true}

# Response compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/html,text/css,text/plain,image/svg+xml
server.compression.min-response-size=1024

# Request size & timeout hardening
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-form-post-size=2MB
server.tomcat.connection-timeout=20000

# Limit embedded Tomcat resource usage for the Render Free instance.
# Keep enough connection capacity for REST requests and WebSocket clients.
server.tomcat.threads.max=15
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100
server.tomcat.accept-count=20
